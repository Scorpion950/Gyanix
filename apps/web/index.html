<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Gyanix — AI-powered social and collaborative learning platform for students, developers and self-learners." />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Open Graph / Social preview -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Gyanix — Learn Together, Grow Together" />
    <meta property="og:description" content="AI-powered collaborative learning platform combining the productivity of Notion with the community energy of Discord." />
    <meta property="og:image" content="/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <title>Gyanix</title>

    <!--
      ⚠️  CRITICAL: Theme initialisation script.
      This script runs synchronously BEFORE the first paint to prevent
      Flash Of Wrong Theme (FOWT). It reads the user's persisted preference
      and applies the class before any CSS or React code runs.
      Do NOT move this to a module script or defer it.
    -->
    <script>
      (function () {
        const STORAGE_KEY = 'gyanix-theme';
        const DEFAULT_THEME = 'dark';

        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          let theme = DEFAULT_THEME;
          if (raw) {
            if (raw.startsWith('{')) {
              const parsed = JSON.parse(raw);
              theme = parsed?.state?.theme || DEFAULT_THEME;
            } else {
              theme = raw;
            }
          }
          const useDark = theme === 'dark';

          if (useDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
          document.documentElement.setAttribute('data-theme', theme);
        } catch (_e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <style>
      .skip-nav {
        position: absolute !important;
        width: 1px !important;
        height: 1px !important;
        padding: 0 !important;
        margin: -1px !important;
        overflow: hidden !important;
        clip: rect(0, 0, 0, 0) !important;
        white-space: nowrap !important;
        border: 0 !important;
      }
      .skip-nav:focus {
        position: fixed !important;
        top: 1rem !important;
        left: 1rem !important;
        z-index: 9999 !important;
        width: auto !important;
        height: auto !important;
        padding: 0.5rem 1rem !important;
        clip: auto !important;
        white-space: normal !important;
        background: #4f46e5 !important;
        color: #ffffff !important;
        border-radius: 0.375rem !important;
      }
    </style>
  </head>
  <body>
    <!-- Skip to main content — accessibility -->
    <a href="#main-content" class="skip-nav" style="position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;">Skip to content</a>

    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
